<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Cadastrar</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="form-wrap">
    <h1>Cadastrar</h1>

    <form id="formCadastro">
      <div class="campo">
        <label for="email">E-mail:</label>
        <input type="email" id="email" required>
      </div>
      <div class="campo">
        <label for="senha">Senha:</label>
        <input type="password" id="senha" required>
      </div>
      <div class="campo">
        <label for="nome">Nome:</label>
        <input type="text" id="nome" required>
      </div>
      <div class="campo">
        <label for="endereco">Endereço:</label>
        <input type="text" id="endereco" required>
      </div>
      <div class="campo">
        <label for="cpf">CPF:</label>
        <input type="text" id="cpf" maxlength="14" placeholder="000.000.000-00" required>
      </div>
      <div class="campo">
        <label for="imagem">Imagem:</label>
        <input type="file" id="imagem" accept="image/*" required>
        <img id="preview" alt="Pré-visualização da imagem">
      </div>

      <button type="submit" class="btn">Cadastrar</button>
    </form>

    <p id="mensagem"></p>
    <a class="voltar" href="index.html">Voltar para a página inicial</a>
  </main>

  <script src="cadastro.js"></script>
</body>
</html>
